<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="n-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
  </defs>

  <circle cx="256" cy="256" r="220" stroke="rgba(255,255,255,0.15)" stroke-width="12" stroke-dasharray="20 40" stroke-linecap="round" />

  <path d="M160 380 L160 132" stroke="url(#n-grad)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M160 132 L352 380" stroke="url(#n-grad)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M352 380 L352 132" stroke="url(#n-grad)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
  <circle cx="160" cy="132" r="24" fill="#f97316" />
  <circle cx="160" cy="380" r="24" fill="#f97316" />
  <circle cx="352" cy="132" r="24" fill="#22c55e" />
  <circle cx="352" cy="380" r="24" fill="#22c55e" />
</svg>
